# Argo CD Application: the cluster follows git (brief §7, GitOps).
# Production syncs only when someone presses Sync in Argo CD (no automated policy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nobar-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/salardelkesh85/nobar.git
    targetRevision: main
    path: infra/helm/nobar-api
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nobar-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
