# Argo CD Application: the cluster follows git (brief §7, GitOps).
# Staging syncs automatically on every change to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nobar-api-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/salardelkesh85/nobar.git
    targetRevision: main
    path: infra/helm/nobar-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nobar-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
