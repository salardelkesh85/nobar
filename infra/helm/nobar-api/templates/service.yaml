apiVersion: v1
kind: Service
metadata:
  name: {{ include "nobar-api.name" . }}
  labels: {{- include "nobar-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "nobar-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
