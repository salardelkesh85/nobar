{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller (and Prometheus in the observability namespace) may reach the API.
# Egress is left open: the API calls PostgreSQL, the payment gateway and the SMS provider.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nobar-api.name" . }}
  labels: {{- include "nobar-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "nobar-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: http
{{- end }}
