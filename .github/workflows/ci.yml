# Typecheck and tests for the backend and shared packages. No Docker needed: the API tests run on embedded PGlite.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint:rtl

      - run: pnpm test

      - name: Helm chart renders for staging and production
        run: |
          helm lint infra/helm/nobar-api
          helm template nobar-api infra/helm/nobar-api > /dev/null
          helm template nobar-api infra/helm/nobar-api -f infra/helm/nobar-api/values-prod.yaml > /dev/null

  # Builds the API image, scans it, and publishes it from main (Argo CD deploys the tag).
  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nobar-api
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -f apps/api/Dockerfile -t "$IMAGE:${{ github.sha }}" .

      - name: Scan for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
