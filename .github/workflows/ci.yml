# Typecheck and tests for the backend and shared packages. No Docker needed: the API tests run on embedded PGlite.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  # Trivy's official image, pinned (scans run the same way locally: docker run aquasec/trivy ...)
  TRIVY: aquasec/trivy:0.58.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint:rtl

      # committed secrets fail the build (Trivy's own image, pinned; scans the checked-out tree)
      - name: Secret scan
        run: docker run --rm -v "$PWD:/src:ro" "$TRIVY" fs --scanners secret --exit-code 1 --skip-dirs /src/node_modules /src

      - run: pnpm test

      - name: Helm chart renders for staging and production
        run: |
          helm lint infra/helm/nobar-api
          helm template nobar-api infra/helm/nobar-api > /dev/null
          helm template nobar-api infra/helm/nobar-api -f infra/helm/nobar-api/values-prod.yaml > /dev/null

  # Builds the API image, scans it, and publishes it from main (Argo CD deploys the tag).
  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nobar-api
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -f apps/api/Dockerfile -t "$IMAGE:${{ github.sha }}" .

      - name: Scan for critical and high vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"

      # the image holds only the API's production dependencies, so this is the dependency audit that matters
      - name: SBOM (CycloneDX)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY" image --format cyclonedx --output /out/sbom-api.cdx.json "$IMAGE:${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-api
          path: sbom-api.cdx.json

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Release gate: the whole Docker Compose stack in production mode (real Caddy, PostgreSQL 17, API, store,
  # panels) with ZarinPal and Melipayamak stand-ins, driven end to end like real users (infra/compose/ci/smoke.mjs).
  stack:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/compose
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configure
        run: |
          cp ci/env.ci .env
          docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml build
          docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml run --rm --no-deps api node dist/keygen.js >> .env

      - name: Start
        run: docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml up -d

      - name: Smoke test through the edge
        run: node ci/smoke.mjs
        env:
          BASE: http://localhost
          STUBS: http://localhost:8080
          STUBS_INTERNAL: http://stubs:8080
          ADMIN_PHONE: "09120000001"

      - name: Backup was written
        run: |
          for i in $(seq 1 30); do ls backups/nobar-*.sql.gz >/dev/null 2>&1 && break; sleep 2; done
          ls -l backups/
          gunzip -c backups/nobar-*.sql.gz | grep -q "CREATE TABLE catalog.listings"

      - name: Logs
        if: always()
        run: docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml logs --no-color --tail=200

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml down -v
