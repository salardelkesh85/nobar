# Builds the buyer Android app (apps/mobile), then installs it on an Android emulator and runs the end-to-end
# check (apps/mobile/e2e/app.mjs) with screenshots of the real screen.
#
# Release signing: add the repository secrets NOBAR_KEYSTORE_BASE64, NOBAR_KEYSTORE_PASSWORD, NOBAR_KEY_ALIAS and
# NOBAR_KEY_PASSWORD so every build is signed with the same key (needed to update an installed app and for a store).
# Without them the release APK is signed with a key made for that run.
#
# Publishing: run the workflow by hand with "publish" on, or push a tag `android-v*`, to attach the APK to a
# GitHub release that anyone with the link can download.
name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - apps/mobile/**
      - apps/web/**
      - packages/**
      - .github/workflows/android.yml
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the APK to the GitHub release android-v<version>
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Store build for the app (static, app mode)
        run: pnpm --filter @nobar/mobile build:web

      - name: Copy it into the Android project
        run: pnpm --filter @nobar/mobile sync

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - id: version
        run: echo "version=$(node -p "require('./apps/mobile/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOBAR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOBAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOBAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOBAR_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/nobar.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            { echo "NOBAR_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "NOBAR_KEY_ALIAS=$KEY_ALIAS"; echo "NOBAR_KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets; the release APK is signed with a key made for this run."
            pass="$(openssl rand -hex 16)"
            echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias nobar \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nobar, O=Nobar, C=IR" -noprompt
            { echo "NOBAR_KEYSTORE_PASSWORD=$pass"; echo "NOBAR_KEY_ALIAS=nobar"; echo "NOBAR_KEY_PASSWORD=$pass"; } >> "$GITHUB_ENV"
          fi
          echo "NOBAR_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - name: Build the APKs
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/nobar-${{ steps.version.outputs.version }}.apk"
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/nobar-${{ steps.version.outputs.version }}-debug.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: nobar-android
          path: dist/*.apk
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nobar-android
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Playwright (drives the app's WebView over adb)
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          cp apps/mobile/e2e/app.mjs "$RUNNER_TEMP/e2e/"
          cd "$RUNNER_TEMP/e2e"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund playwright@1.63.0 >/dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHOTS: ${{ github.workspace }}/shots
          E2E: ${{ runner.temp }}/e2e
          VERSION: ${{ needs.build.outputs.version }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r "dist/nobar-$VERSION-debug.apk"
            node "$E2E/app.mjs"
            adb uninstall ir.nobar.app
            adb install "dist/nobar-$VERSION.apk"
            adb shell am start -W -n ir.nobar.app/.MainActivity
            sleep 12
            adb exec-out screencap -p > "$SHOTS/99-release-build.png"
            adb shell pidof ir.nobar.app

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: shots/
          if-no-files-found: warn

  publish:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nobar-android
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: android-screenshots
          path: shots

      - name: GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v${{ needs.build.outputs.version }}
        run: |
          apk="dist/nobar-${{ needs.build.outputs.version }}.apk"
          (cd shots && zip -q -r ../nobar-screenshots.zip .)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" nobar-screenshots.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$apk" nobar-screenshots.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "نوبر برای اندروید ${{ needs.build.outputs.version }}" \
              --notes "اپ خریداران نوبر برای اندروید ۷ و بالاتر. فایل nobar-${{ needs.build.outputs.version }}.apk را روی گوشی باز کنید و نصب را تأیید کنید. تصویرهای اجرای اپ روی شبیه‌ساز اندروید ۱۴ در nobar-screenshots.zip است."
          fi
