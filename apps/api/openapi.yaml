openapi: 3.1.0
info:
  title: Nobar API
  version: 0.1.0
  description: |
    Backend of Nobar (نوبر), one modular app (ADR 0008). Errors are RFC 9457 Problem Details
    (`application/problem+json`) with a stable `code` and a Persian `detail`.
    Money is integer Rial; dates are ISO-8601 UTC.
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Problem:
      type: object
      required: [status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [OTP_INVALID, OTP_EXPIRED, OTP_LOCKED, RATE_LIMITED, REFRESH_REUSED, VALIDATION, UNAUTHORIZED, NOT_FOUND] }
        detail: { type: string, examples: ["کد درست نیست؛ ۴ بار دیگر می‌توانید امتحان کنید"] }
        errors: {}
        requestId: { type: string }
    Phone:
      type: string
      description: Iranian mobile number in any common form (Persian digits allowed); stored as E.164.
      examples: ["09141234567", "۰۹۱۴۱۲۳۴۵۶۷", "+989141234567"]
    User:
      type: object
      required: [id, phone, name, roles, cityId, createdAt]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, examples: ["+989141234567"] }
        name: { type: [string, "null"] }
        roles: { type: array, items: { enum: [BUYER, SELLER, COURIER, ADMIN] } }
        cityId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string, description: "ES256 JWT, 15 minutes" }
        refreshToken: { type: string, description: "opaque; rotated on every refresh" }
        expiresIn: { type: integer, examples: [900] }
        user: { $ref: "#/components/schemas/User" }
    AddressInput:
      type: object
      required: [title, cityId, name, phone, line, postalCode]
      properties:
        title: { type: string, maxLength: 40, examples: ["خانه"] }
        cityId: { type: string, examples: [miandoab] }
        name: { type: string, minLength: 3 }
        phone: { $ref: "#/components/schemas/Phone" }
        line: { type: string, minLength: 10 }
        postalCode: { type: string, description: "10 digits; Persian digits allowed" }
    Address:
      allOf:
        - $ref: "#/components/schemas/AddressInput"
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid } }
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
security:
  - bearer: []
paths:
  /healthz:
    get: { security: [], summary: Liveness, responses: { "200": { description: Process is up } } }
  /readyz:
    get: { security: [], summary: Readiness (database reachable), responses: { "200": { description: Ready }, "503": { description: Not ready } } }
  /metrics:
    get: { security: [], summary: Prometheus metrics, responses: { "200": { description: Metrics text } } }
  /.well-known/jwks.json:
    get: { security: [], summary: Public keys that verify access tokens, responses: { "200": { description: JWKS } } }
  /v1/auth/otp:
    post:
      security: []
      summary: Send a 6-digit sign-in code by SMS
      description: Code expires after 2 minutes; resend after 60 s; at most 5 codes per phone and 20 per IP per hour.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { $ref: "#/components/schemas/Phone" } } } } }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresInSec: { type: integer, examples: [120] }
                  resendInSec: { type: integer, examples: [60] }
                  devCode: { type: string, description: "only when OTP_ECHO is on (never in production)" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/verify:
    post:
      security: []
      summary: Check the code and sign in (registers the user on first sign-in)
      description: At most 5 attempts per code. `isNew` tells the app to ask for the user's name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone, code], properties: { phone: { $ref: "#/components/schemas/Phone" }, code: { type: string, examples: ["123456", "۱۲۳۴۵۶"] } } }
      responses:
        "200":
          description: Signed in
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/AuthTokens" }, { type: object, properties: { isNew: { type: boolean } } }] } } }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/refresh:
    post:
      security: []
      summary: Rotate the refresh token
      description: Reusing an already-rotated token ends the whole session family (REFRESH_REUSED).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } } }
      responses:
        "200": { description: New tokens, content: { application/json: { schema: { $ref: "#/components/schemas/AuthTokens" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/auth/logout:
    post:
      security: []
      summary: Sign out (ends this session family)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } } }
      responses: { "204": { description: Signed out } }
  /v1/me:
    get:
      summary: Current user
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Update name or city
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 2, maxLength: 60 }, cityId: { type: string } } } } } }
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/me/addresses:
    get:
      summary: My addresses
      responses: { "200": { description: Addresses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Address" } } } } } }
    post:
      summary: Add an address
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/me/addresses/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Edit an address
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Remove an address
      responses: { "204": { description: Removed }, "404": { $ref: "#/components/responses/Problem" } }
  # ---------- catalog (public; `dest` is a destination city id, default tehran)
  /v1/catalog/categories:
    get: { security: [], summary: Categories, responses: { "200": { description: Categories } } }
  /v1/catalog/produce-types:
    get: { security: [], summary: Produce types with season and market statistics, responses: { "200": { description: Produce types } } }
  /v1/catalog/produce-types/{id}/candidates:
    get:
      security: []
      summary: Cheapest deliverable listing ids of one produce type
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dest, in: query, schema: { type: string } }
        - { name: grams, in: query, schema: { type: integer, minimum: 250, maximum: 50000, default: 5000 } }
      responses: { "200": { description: Listing ids }, "404": { $ref: "#/components/responses/Problem" } }
  /v1/shops:
    get:
      security: []
      summary: Active shops
      parameters: [{ name: city, in: query, schema: { type: string } }]
      responses: { "200": { description: Shop cards } }
  /v1/shops/{slug}:
    get:
      security: []
      summary: One shop with its published listings
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Shop }, "404": { $ref: "#/components/responses/Problem" } }
  /v1/listings/{slug}:
    get:
      security: []
      summary: Listing with freshness, delivery options to `dest`, market statistic and price position
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: dest, in: query, schema: { type: string } }
      responses: { "200": { description: Listing detail }, "404": { $ref: "#/components/responses/Problem" } }
  /v1/search:
    get:
      security: []
      summary: Persian search over deliverable listings (landed price to `dest`)
      parameters:
        - { name: dest, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: produceType, in: query, schema: { type: string } }
        - { name: originProvince, in: query, schema: { type: string } }
        - { name: shopId, in: query, schema: { type: string } }
        - { name: organic, in: query, schema: { type: boolean } }
        - { name: freshOnly, in: query, schema: { type: boolean } }
        - { name: nobarOnly, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { enum: [relevance, landed, freshness, newest, rating] } }
        - { name: limit, in: query, description: "Page size (1–100). Without it every hit is returned; `total` is always the full count.", schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: Hits and the listings that cannot reach `dest` }, "400": { $ref: "#/components/responses/Problem" } }
  /v1/compare:
    get:
      security: []
      summary: Compare up to 4 listings by landed price per kg, freshness on arrival, rating and speed
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string, description: comma separated listing ids } }
        - { name: dest, in: query, schema: { type: string } }
        - { name: grams, in: query, schema: { type: integer, default: 5000 } }
        - { name: preset, in: query, schema: { enum: [balanced, budget, freshest, fastest], default: balanced } }
      responses: { "200": { description: Ranked offers with badges, and excluded listings }, "400": { $ref: "#/components/responses/Problem" } }
  /v1/suggest:
    get:
      security: []
      summary: Autocomplete over produce types
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses: { "200": { description: Produce types } }
  # ---------- cart, checkout, orders, sellers, staff, reviews, notifications (errors: Problem Details)
  /v1/catalog/produce-types/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      security: []
      summary: "One produce type with season and market statistics"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/origins/{city}:
    parameters: [{ name: city, in: path, required: true, schema: { type: string } }]
    get:
      security: []
      summary: "Listings from one origin city deliverable to `dest`"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/cart:
    get:
      summary: "Server cart, revalidated (prices, stock, delivery to `dest`) on every read"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
    delete:
      summary: "Empty the cart"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/cart/items:
    post:
      summary: "Add a package of a listing to the cart"
      description: "Requires Idempotency-Key."
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }]
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
    patch:
      summary: "Set the quantity of a cart line (0 removes it)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/cart/items/{listingId}/{packageId}:
    parameters: [{ name: listingId, in: path, required: true, schema: { type: string } }, { name: packageId, in: path, required: true, schema: { type: string } }]
    delete:
      summary: "Remove a cart line"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/checkouts:
    post:
      summary: "Reserve stock for 10 minutes and create one order per shop (body: addressId, paymentMethod GATEWAY, optional shipping method per shop)"
      description: "Requires Idempotency-Key."
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }]
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/checkouts/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: "Checkout with its shop orders"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/checkouts/{id}/pay:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Start a gateway payment; returns redirectUrl"
      description: "Requires Idempotency-Key."
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }]
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/payments/callback:
    get:
      security: []
      summary: "Gateway return (Authority, Status); verifies, books escrow once, redirects to the store"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/payments/fake/{authority}:
    parameters: [{ name: authority, in: path, required: true, schema: { type: string } }]
    get:
      security: []
      summary: "Test gateway page (PAYMENT_PROVIDER=fake only)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/me/wallet:
    get:
      summary: "Wallet balance and recent entries (refunds land here)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/orders:
    get:
      summary: "My shop orders"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/orders/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: "One of my orders, by id or code"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/orders/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Cancel before the shop accepts (full refund to wallet)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/orders/{id}/delivered:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Confirm delivery; starts the complaint window"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/orders/{id}/dispute:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Report a problem (shipped, or delivered within the complaint window)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/shop:
    get:
      summary: "My shop, review note and masked KYC"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
    post:
      summary: "Apply for a shop with KYC (or re-apply after rejection)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
    patch:
      summary: "Edit shop details, story, shipping"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/listings:
    get:
      summary: "My listings with freshness and moderation notes"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
    post:
      summary: "New listing (waits for staff review)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/listings/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: "Edit a listing (back to review)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/listings/{id}/stock:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: "Set stock (grams or units)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/listings/{id}/prices:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: "Set package prices; a jump over 30% opens a review case"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/listings/{id}/pause:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Take a listing off sale"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/listings/{id}/resume:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Back on sale (or to review if staff paused it)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/orders:
    get:
      summary: "Orders of my shops (optional status filter)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/orders/{id}/accept:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Accept within the shop"s SLA"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/orders/{id}/reject:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Reject (full refund to the buyer, stock back)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/orders/{id}/ship:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Mark shipped (tracking code unless own courier)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/orders/{id}/dispute/answer:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Answer a complaint, optionally offering an amount"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/balance:
    get:
      summary: "Settled balance and payouts per shop"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/reviews:
    get:
      summary: "Reviews of my shops"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/reviews/{id}/reply:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Reply to a published review"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/questions:
    get:
      summary: "Questions about my listings"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/questions/{id}/answer:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Answer a question"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/listings/{id}/reviews:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      security: []
      summary: "Published reviews of a listing"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
    post:
      summary: "Review a delivered order line (waits for staff)"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/listings/{id}/questions:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      security: []
      summary: "Answered questions of a listing"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
    post:
      summary: "Ask the shop a question"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/me/questions:
    get:
      summary: "My questions"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/me/notifications:
    get:
      summary: "My notifications and unread count"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/me/notifications/{id}/read:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Mark one (or `all`) read"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/assistant/chat:
    post:
      summary: "Ask the shopping assistant (Baghboon)"
      description: >
        Runs one turn of the agent loop. Facts come only from tools; an answer stating an amount no tool returned is
        replaced. The cart is never changed here: a basket comes back as `basketProposal` for the buyer to confirm.
        `503` with code `ASSISTANT_UNAVAILABLE` means the model is down and the store should fall back to `/v1/search`.
        `429` when the buyer's daily message limit is used up.
      parameters: [{ name: dest, in: query, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 500 }
                conversationId: { type: string, format: uuid }
      responses:
        "201":
          description: The assistant's answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId: { type: string, format: uuid }
                  message: { type: string }
                  productCards:
                    type: array
                    items:
                      type: object
                      properties:
                        listingId: { type: string }
                        slug: { type: string }
                        title: { type: string }
                        shopName: { type: string }
                        landedPerKgRial: { type: integer }
                        arrivesWithinDays: { type: integer }
                        freshDaysOnArrival: { type: integer }
                  basketProposal:
                    nullable: true
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      summary: { type: string }
                      items: { type: array, items: { type: object } }
                      itemsRial: { type: integer }
                      shippingRial: { type: integer }
                      totalRial: { type: integer }
                  compareProduceTypeId: { type: string, nullable: true }
                  toolsUsed: { type: array, items: { type: string } }
        "4XX": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/assistant/chat/stream:
    post:
      summary: "The same turn as a server-sent event stream"
      description: >
        Events: `step` (`{tool}`) while a tool runs, then `done` with the reply of `/v1/assistant/chat`, or `error`
        (`{status, code, detail}`). The text is not streamed word by word: it is checked against tool results first.
      parameters: [{ name: dest, in: query, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 500 }
                conversationId: { type: string, format: uuid }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/assistant/conversations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: "Transcript of one of the buyer's conversations"
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/assistant/proposals/{id}/confirm:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: "Add a proposed basket to the cart (the buyer's explicit confirmation)"
      description: "Works once per proposal (`409 PROPOSAL_USED` afterwards). Returns the cart."
      responses: { "201": { description: The cart }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/admin/assistant/conversations/{id}/audit:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: "Every model call, tool call and guardrail decision of a conversation"
      description: "ADMIN role."
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/recommendations:
    get:
      security: []
      summary: "Recommended listings for the home page, or for a product page with `listingId`"
      description: >
        Signals: bought together (paid orders), sold this month, in season. Only listings that reach `dest` fresh,
        one per produce type, each with a `reasonCode` and a Persian `reason`. `enabled: false` with an empty list
        when the `RECOMMENDATIONS` flag is off.
      parameters:
        - { name: dest, in: query, schema: { type: string } }
        - { name: listingId, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/Problem" } }
  /v1/recommendations/cart:
    get:
