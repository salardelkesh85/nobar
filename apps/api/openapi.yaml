                minShelfDaysOnArrival: { type: integer, minimum: 0 }
                complaintWindowHours: { type: integer, minimum: 1, maximum: 720 }
                storage: { type: string, enum: [AMBIENT, COOL, COLD] }
                months: { type: array, items: { type: integer, minimum: 1, maximum: 12 } }
                peakMonths: { type: array, items: { type: integer, minimum: 1, maximum: 12 } }
                needsReview: { type: boolean }
      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
