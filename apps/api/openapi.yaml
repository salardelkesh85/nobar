      responses: { "200": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/copilot/listing-draft:
    post:
      summary: "Draft a listing title and description from facts (advice only; nothing is saved)"
      description: "`source` is `model` or `template` (the plain fallback when the model is down or invents a price or an organic claim)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [produceTypeId, grade, originCityId]
              properties:
                produceTypeId: { type: string }
                variety: { type: string, maxLength: 40 }
                grade: { type: string, enum: [PREMIUM, GRADE_1, GRADE_2, PROCESSING] }
                originCityId: { type: string }
                isOrganic: { type: boolean }
                harvestedDaysAgo: { type: integer, minimum: 0 }
                notes: { type: string, maxLength: 300 }
      responses: { "201": { description: OK }, "4XX": { $ref: "#/components/responses/Problem" } }
  /v1/seller/copilot/reviews/{id}/reply-draft:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
