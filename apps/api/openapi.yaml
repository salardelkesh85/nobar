      description: "ADMIN role. Audited with the old and new values; `needsReview: false` confirms the numbers. Read them from `GET /v1/catalog/produce-types`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
